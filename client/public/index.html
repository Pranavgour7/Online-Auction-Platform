<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d6efd" />

    <!-- SEO Meta Tags -->
    <title>AuctionHub | Real-Time Live Bidding & Online Auction Marketplace</title>
    <meta
      name="description"
      content="AuctionHub is an enterprise real-time online auction platform. Browse, bid, and win authenticated luxury watches, electronics, collectibles, and fine goods with live WebSocket bid updates."
    />
    <meta name="keywords" content="auction platform, online auctions, real-time bidding, live auction, websocket bidding, buy and sell, marketplace, MERN stack auction" />
    <meta name="author" content="Pranav Gour" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://auction-platform.com" />
    <meta property="og:title" content="AuctionHub | Real-Time Live Bidding Marketplace" />
    <meta property="og:description" content="Discover, bid, and win on authenticated collectibles, electronics, and rare items with sub-50ms live bid updates." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=1200&q=80" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AuctionHub | Real-Time Live Bidding Marketplace" />
    <meta name="twitter:description" content="Discover, bid, and win on authenticated collectibles, electronics, and rare items with sub-50ms live bid updates." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=1200&q=80" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts & Font Awesome CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- JSON-LD Structured Data Schema for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AuctionHub",
        "url": "https://auction-platform.com",
        "description": "Real-time online auction platform and bidding marketplace.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://auction-platform.com/auctions?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding: 24px; text-align: center; background-color: #fee2e2; color: #991b1b; font-family: sans-serif;">
        <h2>JavaScript Required</h2>
        <p>Please enable JavaScript to access real-time bidding on AuctionHub.</p>
      </div>
    </noscript>

    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a;">
        <div style="width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #0d6efd; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; font-weight: 600; font-size: 15px;">Loading AuctionHub Platform...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </body>
</html>
